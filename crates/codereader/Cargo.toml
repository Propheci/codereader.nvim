[package]
name = "codereader"
version = "0.1.0"
edition = "2024"
description = "Notes and Trails for reading large codebases (backend for codereader.nvim)"

[lib]
name = "codereader"
path = "src/lib.rs"

[[bin]]
name = "codereader"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
